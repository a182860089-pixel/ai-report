name: ai-report

# Production stack for the VPS. Local Postgres-only compose stays in backend/.
# Scheduler is in-process: never scale `api` above 1 replica.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_report
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/docker/init-prod.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_report"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DEBUG: "false"
      REPOSITORY: postgres
      DATABASE_URL: postgresql+asyncpg://ai_report_app:${APP_DB_PASSWORD}@postgres:5432/ai_report
      ALEMBIC_DATABASE_URL: postgresql+psycopg://ai_report_migrator:${MIGRATOR_DB_PASSWORD}@postgres:5432/ai_report
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      TRUST_PROXY: "true"
      PIPELINE_SCHEDULER_ENABLED: ${PIPELINE_SCHEDULER_ENABLED:-true}
      PIPELINE_SCHEDULE: ${PIPELINE_SCHEDULE:-06:30,12:30,18:30}
      PIPELINE_AUTO_CLUSTER: ${PIPELINE_AUTO_CLUSTER:-true}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_BASE: http://api:8000
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 8s
      retries: 18
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "9080:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - internal

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
