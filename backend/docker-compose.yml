services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ai_report
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_report"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
