[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-report-backend"
version = "0.1.0"
description = "AI 日报 FastAPI V1 — public read API + admin JWT scaffold"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.53.0",
  "sqlalchemy[asyncio]==2.0.52",
  "alembic==1.20.0",
  "asyncpg==0.31.0",
  "psycopg[binary]==3.3.5",
  "pydantic-settings==2.15.0",
  "argon2-cffi==25.1.0",
  "PyJWT[crypto]==2.14.0",
  "email-validator==2.3.0",
  "python-dotenv==1.2.3",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  "ignore::DeprecationWarning",
]
markers = [
  "pg: live PostgreSQL 16 integration tests (opt-in via AI_REPORT_PG_TEST_URL)",
]
